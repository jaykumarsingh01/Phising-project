{% extends "base.html" %}
{% block content %}
<div class="auth-container" style="min-height: calc(100vh - 80px);">
    <div class="auth-card fade-in">
        <div class="auth-header">
            <i class="fas fa-lock-open fa-3x mb-3"></i>
            <h2 class="mb-1">New Password</h2>
        </div>
        <div class="p-4">
            <form method="POST" action="{{ url_for('reset_password', token=token) }}">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" name="password" class="form-control input-custom" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control input-custom" required>
                </div>
                <button type="submit" class="btn btn-accent w-100"><i class="fas fa-check me-2"></i>Reset Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
