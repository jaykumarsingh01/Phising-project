{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-lg-6 text-center py-5">
        <i class="fas fa-circle-check fa-5x mb-3" style="color:var(--success)"></i>
        <h2 class="fw-800">Complaint Submitted!</h2>
        <p class="text-muted fs-5">Your complaint has been recorded in our database.</p>
        <p>Redirecting you to the official Cyber Crime portal...</p>
        <a href="https://cybercrime.gov.in" target="_blank" class="btn btn-accent btn-lg mt-3">
            <i class="fas fa-external-link-alt me-2"></i>Go to cybercrime.gov.in
        </a>
        <div class="mt-3">
            <a href="{{ url_for('home') }}" class="text-decoration-none" style="color:var(--accent)">Back to Scanner</a>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>setTimeout(()=>window.open('https://cybercrime.gov.in','_blank'),3000);</script>
{% endblock %}
