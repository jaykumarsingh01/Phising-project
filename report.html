{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-lg-7">
        <div class="card-custom p-4">
            <h3 class="fw-700 mb-3"><i class="fas fa-flag me-2" style="color:var(--danger)"></i>Report Phishing to Cyber Crime</h3>
            <p class="text-muted">Submit a complaint about the phishing URL. It will be saved and you'll be redirected to the official Cyber Crime portal.</p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-600">Phishing URL</label>
                    <input type="text" name="url" class="form-control input-custom" value="{{ url }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-600">Your Email</label>
                    <input type="email" name="email" class="form-control input-custom" placeholder="you@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-600">Description</label>
                    <textarea name="description" class="form-control input-custom" rows="4" placeholder="Describe the phishing activity..." required></textarea>
                </div>
                <button type="submit" class="btn btn-danger-custom w-100 py-3">
                    <i class="fas fa-paper-plane me-2"></i>Submit Complaint & Report
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
